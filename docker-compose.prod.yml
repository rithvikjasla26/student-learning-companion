version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: student_companion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-student_companion}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-student_companion}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true

  # Backend API
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: student_companion_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-student_companion}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_HAIKU_MODEL: ${CLAUDE_HAIKU_MODEL:-claude-3-5-haiku-20241022}
      CLAUDE_SONNET_MODEL: ${CLAUDE_SONNET_MODEL:-claude-3-5-sonnet-20241022}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-10}
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Kolkata}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
    ports:
      - "5000:5000"
    volumes:
      - ./packages/backend/.env:/app/packages/backend/.env:ro
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Frontend Web Server
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: student_companion_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./packages/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Reverse Proxy (Optional: use Nginx to route requests)
  # Uncomment to use a reverse proxy that routes /api/* to backend
  # and /* to frontend
  #
  # nginx:
  #   image: nginx:alpine
  #   container_name: student_companion_proxy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - app_network
  #   security_opt:
  #     - no-new-privileges:true

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
