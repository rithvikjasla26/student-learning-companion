server {
  listen 3000;
  server_name _;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css text/xml text/javascript
             application/x-javascript application/xml+rss
             application/javascript application/json;
  gzip_min_length 1024;
  gzip_disable "msie6";

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Root directory
  root /usr/share/nginx/html;
  index index.html;

  # Cache static assets for long time (with cache busting via filenames)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # HTML files: no cache, always validate
  location ~* \.html$ {
    expires 0;
    add_header Cache-Control "public, must-revalidate, max-age=0";
  }

  # SPA routing: fall back to index.html for all non-file requests
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, must-revalidate, max-age=0";
  }

  # Proxy API calls to backend (if needed)
  # Uncomment and configure if frontend and backend are on same host
  # location /api/ {
  #   proxy_pass http://backend:5000;
  #   proxy_http_version 1.1;
  #   proxy_set_header Upgrade $http_upgrade;
  #   proxy_set_header Connection 'upgrade';
  #   proxy_set_header Host $host;
  #   proxy_cache_bypass $http_upgrade;
  # }

  # Deny access to sensitive files
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}
