services:
  - type: web_service
    name: student-learning-companion-backend
    env: node
    repo: https://github.com/rithvikjasla26/student-learning-companion
    branch: main
    root: packages/backend
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "node dist/app.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_PORT
        value: "5000"
      - key: FRONTEND_URL
        value: "https://student-learning-companion-frontend.onrender.com"
    healthCheckPath: /health

  - type: static_site
    name: student-learning-companion-frontend
    repo: https://github.com/rithvikjasla26/student-learning-companion
    branch: main
    root: packages/frontend
    plan: free
    buildCommand: "npm install && npm run build"
    publishPath: packages/frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: "https://student-learning-companion-backend.onrender.com/api"

databases:
  - name: student-learning-companion-db
    engine: postgres
    plan: starter
    region: oregon
